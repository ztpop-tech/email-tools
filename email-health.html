<script>
const DOH = [
  n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=`,
  n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=`
];
const PROVIDERS = [
  {name:'Google', url:n=>`https://dns.google/resolve?name=${encodeURIComponent(n)}&type=`},
  {name:'Cloudflare', url:n=>`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=`, hdr:true}
];
async function doh(name, type){
  let lastErr;
  for(const p of PROVIDERS){
    try{
      const req = new Request(p.url(name)+type, {headers:p.hdr?{'Accept':'application/dns-json'}:{}});
      const r = await fetch(req);
      if(!r.ok) continue;
      const j = await r.json();
      if(j.Answer) return j.Answer;
      return []; // NXDOMAIN / empty
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error('DoH failed');
}
async function txt(name){
  const ans = await doh(name,'TXT');
  return ans.map(a=>{
    let s=a.data||'';
    s = s.replace(/^"|"$/g,'');
    try{ s = s.replace(/\\([0-9]{3})/g,(_,c)=>String.fromCharCode(parseInt(c,8))); }catch(e){}
    return s.replace(/"/g,'');
  });
}
async function mx(name){
  const ans = await doh(name,'MX');
  return ans.map(a=>{
    const m=(a.data||'').match(/^\s*\d+\s+(.+)$/);
    return m? m[1].replace(/\.$/,''): (a.data||'');
  });
}
async function aRec(name){
  const ans = await doh(name,'A');
  return ans.map(a=>a.data).filter(Boolean);
}
async function ptr(ip){
  const parts = ip.split('.').reverse().join('.');
  try{ const ans = await doh(parts+'.in-addr.arpa','PTR'); return ans.map(a=>(a.data||'').replace(/\.$/,'')).filter(Boolean); }
  catch(e){ return []; }
}
// 带超时的 DoH（避免个别 RBL/接口拖垮整体）
function dohT(name,type,ms){
  return Promise.race([
    doh(name,type).then(a=>a),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))
  ]).catch(()=>[]);
}

const DKIM_SELECTORS = ['default','selector1','selector2','google','k1','dkim','mail','ses','amazonses',
  's1','s2','dkim1','dkim2','mte','protonmail','cm','ct','d365','bounce','bnc3','mandrill',
  'sparkpost','sendgrid','emarsys','cheetah','everlytickey1','eversrv'];
const RBL_LIST = [
  {name:'zen.spamhaus.org', note:'Spamhaus ZEN'},
  {name:'bl.spamcop.net', note:'SpamCop'},
  {name:'dnsbl.sorbs.net', note:'SORBS'},
  {name:'cbl.abuseat.org', note:'CBL'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

function addCheck(box, id, title, status, detail, fix){
  const card = el('div','chk');
  const tagTxt = {pass:'通过',warn:'注意',fail:'风险',na:'未测'}[status]||status;
  card.appendChild(el('h3',null,`${title} <span class="tag ${status}">${tagTxt}</span>`));
  card.appendChild(el('div','detail', detail||''));
  if(fix){ const f=el('div','fix show', '建议：'+fix); card.appendChild(f); }
  box.appendChild(card);
}

function scoreColor(s){ return s>=80?'#16a34a': s>=60?'#d97706': '#dc2626'; }
function levelOf(s){ return s>=90?['优秀','域名邮件配置完善，投递能力与防伪能力强']
  : s>=75?['良好','配置基本到位，仍有小幅优化空间']
  : s>=55?['中等','存在明显短板，建议尽快修复']
  : s>=35?['偏弱','多项关键防护缺失，伪造与进垃圾箱风险高']
  : ['危险','几乎无邮件安全配置，极易被仿冒与拦截']; }

async function run(){
  const raw = document.getElementById('domain').value.trim().toLowerCase();
  const errBox = document.getElementById('err');
  errBox.classList.remove('show');
  const domain = raw.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
  if(!/^[a-z0-9.-]+\.[a-z]{2,}$/.test(domain)){
    errBox.textContent='请输入合法的域名，例如 ztpop.net'; errBox.classList.add('show'); return;
  }
  const btn=document.getElementById('run'); btn.disabled=true;
  document.getElementById('loading').classList.add('show');
  document.getElementById('scoreCard').classList.remove('show');
  const box=document.getElementById('checks'); box.innerHTML='';

  const res={};
  // SPF
  try{ const t=await txt(domain); const spf=t.find(x=>/^v=spf1/i.test(x));
    if(spf){ const soft=/\s\+all\b/.test(spf), hard=/\s-all\b/.test(spf), neutral=/\s\?all\b/.test(spf);
      res.spf={status: hard?'pass': soft?'warn':'fail', detail:'<code>'+escapeHtml(spf)+'</code>',
        fix: soft?'建议将 +all 改为 -all（硬失败）以彻底阻止伪造': neutral?'建议将 ?all 改为 -all（硬失败）':null};
    } else res.spf={status:'fail', detail:'未发现 SPF 记录', fix:'添加 TXT 记录：v=spf1 包含你的邮件发送源 -all'};
  }catch(e){ res.spf={status:'na', detail:'查询失败', fix:null}; }

  // DMARC
  try{ const t=await txt('_dmarc.'+domain); const dm=t.find(x=>/^v=DMARC1/i.test(x));
    if(dm){ const p=(dm.match(/p=(\w+)/i)||[])[1]||''; const ruaf=(dm.match(/rua=/i)||[])[0];
      res.dmarc={status: p==='reject'?'pass': p==='quarantine'?'warn':'fail',
        detail:'<code>'+escapeHtml(dm)+'</code>',
        fix: p==='none'?'将 p=none 提升到 quarantine 再到 reject，并加 rua= 接收报告': (p==='quarantine'?'建议最终设为 p=reject 并配置 rua 报告':null)};
    } else res.dmarc={status:'fail', detail:'未发现 DMARC 记录', fix:'添加 _dmarc 子域 TXT：v=DMARC1 p=none rua=mailto:dmarc@'+domain};
  }catch(e){ res.dmarc={status:'na', detail:'查询失败', fix:null}; }

  // DKIM
  try{ let found=[];
    await Promise.all(DKIM_SELECTORS.map(async sel=>{
      try{ const t=await txt(sel+'._domainkey.'+domain); if(t.find(x=>/^v=DKIM1/i.test(x))) found.push(sel); }catch(e){}
    }));
    if(found.length) res.dkim={status:'pass', detail:'命中选择器：'+found.join(', '), fix:null};
    else res.dkim={status:'warn', detail:'未在我们试探的 '+DKIM_SELECTORS.length+' 个常见选择器中找到 DKIM', fix:'确认你的邮件系统/服务商 DKIM 选择器，并发布对应 _domainkey TXT 记录'};
  }catch(e){ res.dkim={status:'na', detail:'查询失败', fix:null}; }

  // BIMI
  try{ const t=await txt('default._bimi.'+domain); const bm=t.find(x=>/^v=BIMI1/i.test(x));
    res.bimi = bm? {status:'pass', detail:'<code>'+escapeHtml(bm)+'</code>', fix:null}
      : {status:'na', detail:'未发现 BIMI 记录（品牌标识，非必需）', fix:'已配置 DMARC p=quarantine/reject 后可加 default._bimi TXT 展示品牌 logo'};
  }catch(e){ res.bimi={status:'na', detail:'查询失败', fix:null}; }

  // MX
  let mxList=[];
  try{ mxList=await mx(domain);
    res.mx = mxList.length? {status:'pass', detail:mxList.join('<br>'), fix:null}
      : {status:'fail', detail:'未发现 MX 记录', fix:'添加 MX 记录指向你的邮件服务器'};
  }catch(e){ res.mx={status:'na', detail:'查询失败', fix:null}; }

  // PTR / FCrDNS
  try{ let ptrInfo=[], issue=false;
    for(const m of mxList.slice(0,3)){
      const ips=await aRec(m).catch(()=>[]);
      for(const ip of ips.slice(0,2)){
        const ps=await ptr(ip).catch(()=>[]);
        ptrInfo.push(m+' ('+ip+') → '+(ps.join(', ')||'无 PTR'));
        if(!ps.length) issue=true;
      }
    }
    res.ptr = ptrInfo.length? {status: issue?'warn':'pass', detail:ptrInfo.join('<br>'), fix: issue?'为邮件服务器 IP 配置反向 PTR 并使其解析回 MX 主机名（FCrDNS）':null}
      : {status:'na', detail:'无 MX 或 MX 无 A 记录，跳过', fix:null};
  }catch(e){ res.ptr={status:'na', detail:'查询失败', fix:null}; }

  // MTA-STS
  try{
    const ctrl = new AbortController(); const t=setTimeout(()=>ctrl.abort(),6000);
    const r = await fetch('https://mta-sts.'+domain+'/.well-known/mta-sts.txt',{mode:'cors',signal:ctrl.signal}).catch(()=>null);
    clearTimeout(t);
    if(r && r.ok){ const txt2=await r.text();
      const mode=(txt2.match(/mode:\s*(\w+)/i)||[])[1]||'';
      res.mtasts={status:'pass', detail:'mode='+mode, fix:null};
    } else res.mtasts={status:'warn', detail:'未发布 MTA-STS 策略', fix:'部署 mta-sts.'+domain+'/.well-known/mta-sts.txt 启用 TLS 强制策略'};
  }catch(e){ res.mtasts={status:'warn', detail:'未发布 MTA-STS 策略', fix:'部署 mta-sts.'+domain+'/.well-known/mta-sts.txt 启用 TLS 强制策略'}; }

  // RBL (best effort, 仅首 IP × 3 库，单条 4s 熔断)
  try{ let hits=[];
    const m0=mxList[0];
    if(m0){
      const ips=await aRec(m0).catch(()=>[]);
      const ip0=ips[0];
      if(ip0){
        const rev=ip0.split('.').reverse().join('.');
        for(const rb of RBL_LIST.slice(0,3)){
          const ans=await dohT(rev+'.'+rb.name,'A',4000);
          if(ans&&ans.length) hits.push(rb.note+' ('+ip0+')');
        }
      }
    }
    res.rbl = hits.length? {status:'fail', detail:'命中黑名单：'+hits.join('；'), fix:'按对应黑名单解除流程申诉，并排查是否存在发出垃圾/钓鱼邮件'}
      : {status:'pass', detail:'抽查的主流黑名单中未发现该域名邮件服务器 IP', fix:null};
  }catch(e){ res.rbl={status:'na', detail:'黑名单查询失败（部分 RBL 不支持 DoH）', fix:null}; }

  // score
  const w={spf:20,dmarc:25,dkim:20,mx:10,ptr:10,mtasts:5,bimi:5,rbl:5};
  let score=0;
  score += (res.spf.status==='pass'?20: res.spf.status==='warn'?12:0);
  score += (res.dmarc.status==='pass'?25: res.dmarc.status==='warn'?14:0);
  score += (res.dkim.status==='pass'?20: res.dkim.status==='warn'?8:0);
  score += (res.mx.status==='pass'?10:0);
  score += (res.ptr.status==='pass'?10: res.ptr.status==='warn'?4:0);
  score += (res.mtasts.status==='pass'?5:0);
  score += (res.bimi.status==='pass'?5:0);
  score += (res.rbl.status==='pass'?5:0);
  score=Math.max(0,Math.min(100,Math.round(score)));

  // render
  const arc=document.getElementById('arc');
  arc.style.stroke = scoreColor(score);
  arc.style.strokeDashoffset = (414.7*(1-score/100)).toFixed(1);
  document.getElementById('score').textContent=score;
  const [lv,desc]=levelOf(score);
  const lvEl=document.getElementById('lv'); lvEl.textContent=lv;
  lvEl.style.background = score>=75?'var(--ok-bg)': score>=55?'var(--warn-bg)':'var(--bad-bg)';
  lvEl.style.color = score>=75?'var(--ok)': score>=55?'var(--warn)':'var(--bad)';
  document.getElementById('grade').textContent='邮件域名健康评估';
  document.getElementById('summary').innerHTML='综合得分 <b>'+score+'</b> · '+desc;
  document.getElementById('scoreCard').classList.add('show');

  addCheck(box,'spf','SPF 发件人策略', res.spf.status, res.spf.detail, res.spf.fix);
  addCheck(box,'dmarc','DMARC 防伪策略', res.dmarc.status, res.dmarc.detail, res.dmarc.fix);
  addCheck(box,'dkim','DKIM 签名', res.dkim.status, res.dkim.detail, res.dkim.fix);
  addCheck(box,'bimi','BIMI 品牌标识', res.bimi.status, res.bimi.detail, res.bimi.fix);
  addCheck(box,'mx','MX 邮件路由', res.mx.status, res.mx.detail, res.mx.fix);
  addCheck(box,'ptr','PTR / FCrDNS 反向解析', res.ptr.status, res.ptr.detail, res.ptr.fix);
  addCheck(box,'mtasts','MTA-STS 传输加密', res.mtasts.status, res.mtasts.detail, res.mtasts.fix);
  addCheck(box,'rbl','黑名单 (RBL)', res.rbl.status, res.rbl.detail, res.rbl.fix);

  document.getElementById('loading').classList.remove('show');
  btn.disabled=false;
  window.history.replaceState(null,'', location.pathname+'?domain='+encodeURIComponent(domain));
}

function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

document.getElementById('run').addEventListener('click',run);
document.getElementById('domain').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
document.getElementById('copyUrl').addEventListener('click',()=>{
  const u=location.origin+location.pathname+'?domain='+encodeURIComponent(document.getElementById('domain').value.trim());
  navigator.clipboard.writeText(u).then(()=>alert('分享链接已复制'));
});
document.getElementById('copyReport').addEventListener('click',()=>{
  const d=document.getElementById('domain').value.trim();
  const s=document.getElementById('score').textContent;
  let txt='【邮件域名健康分】'+d+' = '+s+'/100\n';
  document.querySelectorAll('#checks .chk').forEach(c=>{
    const h=c.querySelector('h3').innerText; const det=c.querySelector('.detail').innerText;
    txt+='\n• '+h.replace('通过','✅').replace('注意','⚠️').replace('风险','❌').replace('未测','➖')+'\n  '+det+'\n';
  });
  txt+='\n检测工具：ztpop.net 邮件域名健康分';
  navigator.clipboard.writeText(txt).then(()=>alert('检测报告已复制，可粘贴到微信/工单'));
});
